
openapi: 3.0.3

info:
  title: Disaster Resource Coordination - Field Reports API
  version: "1.1.0"
  description: >
    API for creating, retrieving, listing and uploading photos for field
    reports. Supports JSON by default, XML when requested, Problem Details
    errors, validation, idempotent report creation and rate limiting.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Reports
    description: Field report operations
  - name: Photos
    description: Report photo uploads
  - name: Health
    description: Service health checks

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service and database health
      responses:
        "200":
          description: Service and database are available
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  status:
                    type: string
                  database:
                    type: string
            application/xml:
              schema:
                type: object
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "503":
          description: Database is unavailable
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
            application/xml:
              schema:
                type: object
        "500":
          $ref: "#/components/responses/InternalError"

  /reports:
    post:
      tags:
        - Reports
      summary: Create a field report
      description: >
        Creates a report using a UUID Idempotency-Key. A repeated request
        with the same key and identical normalized payload replays the
        existing result instead of creating a duplicate. Reusing the key
        with a different payload returns a conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report created
          headers:
            Location:
              description: URI of the created report
              schema:
                type: string
                example: /reports/116
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
            application/xml:
              schema:
                type: object
        "200":
          description: Existing report returned for an idempotent replay
          headers:
            Location:
              description: URI of the existing report
              schema:
                type: string
            Idempotency-Replayed:
              description: Replay indicator, if supplied by the implementation
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
            application/xml:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - Reports
      summary: List field reports
      description: >
        Lists reports with optional filtering, sorting and pagination.
        JSON is the default response format. XML can be requested using
        the Accept header.
      parameters:
        - name: shelterId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Severity"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - reportId
              - createdAt
              - severity
            default: reportId
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Matching reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
            application/xml:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags:
        - Reports
      summary: Retrieve one field report
      responses:
        "200":
          description: Report found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
            application/xml:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/{reportId}/photos:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    post:
      tags:
        - Photos
      summary: Upload a photo for a field report
      description: >
        Uploads one JPEG, PNG or WebP image. The maximum file size is
        5 MiB. The report must already exist.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Photo uploaded and metadata saved
          headers:
            Location:
              description: URI identifying the uploaded photo
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPhoto"
            application/xml:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID identifying one logical report-creation attempt.
      schema:
        type: string
        format: uuid

  schemas:
    Severity:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL

    CreateReportRequest:
      type: object
      required:
        - shelterId
        - reportedBy
        - reportType
        - severity
        - description
      properties:
        shelterId:
          type: integer
          format: int64
          minimum: 1
        reportedBy:
          type: integer
          format: int64
          minimum: 1
        reportType:
          type: string
          minLength: 1
          maxLength: 50
        severity:
          $ref: "#/components/schemas/Severity"
        description:
          type: string
          minLength: 1
        occupancyCount:
          type: integer
          minimum: 0
          nullable: true

    Report:
      type: object
      required:
        - reportId
        - shelterId
        - reportedBy
        - reportType
        - severity
        - description
        - createdAt
      properties:
        reportId:
          type: integer
          format: int64
        shelterId:
          type: integer
          format: int64
        reportedBy:
          type: integer
          format: int64
        reportType:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        description:
          type: string
        occupancyCount:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    ReportPhoto:
      type: object
      required:
        - photoId
        - reportId
        - fileName
        - contentType
        - fileSizeBytes
        - storagePath
        - uploadedAt
      properties:
        photoId:
          type: integer
          format: int64
        reportId:
          type: integer
          format: int64
        fileName:
          type: string
        contentType:
          type: string
        fileSizeBytes:
          type: integer
        storagePath:
          type: string
        uploadedAt:
          type: string
          format: date-time

    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: Stable URI identifying the problem type
          example: /errors/validation-error
        title:
          type: string
          example: Validation Failed
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: One or more fields are invalid
        errors:
          type: array
          description: Field-specific validation errors, when present
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Malformed JSON, invalid parameters or invalid request data
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/xml:
          schema:
            type: object

    NotAcceptable:
      description: Requested response representation is not supported
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: Idempotency key was reused with a different payload
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/xml:
          schema:
            type: object

    NotFound:
      description: Requested report does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/xml:
          schema:
            type: object

    UnprocessableEntity:
      description: Request fields failed application-level validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/xml:
          schema:
            type: object

    PayloadTooLarge:
      description: Request body or uploaded photo exceeds the configured limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/xml:
          schema:
            type: object

    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/xml:
          schema:
            type: object
